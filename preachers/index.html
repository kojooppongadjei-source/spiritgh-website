<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Preachers and Their Shows | Spirit 88.3 FM</title>
<meta name="description" content="Meet the preachers who host shows on Spirit 88.3 FM, Kumasi, and find out when each programme is on air.">
<meta property="og:title" content="Our Preachers | Spirit 88.3 FM">
<meta property="og:description" content="Meet the voices of faith on Spirit 88.3 FM and find out when they are on air.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preachers/preachers.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><b>Spirit 88.3 FM</b><span>Kumasi</span></a>
    <nav aria-label="Main">
      <a class="link" href="/">Home</a>
      <a class="link" href="/preachers/">Preachers</a>
      <button class="listen" type="button" data-listen aria-pressed="false"><span class="dot" aria-hidden="true"></span><span class="lbl">Listen live</span></button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="dir-head">
      <h1>Our preachers and the shows they host</h1>
      <p>Meet the men and women of God behind the programmes on Spirit 88.3 FM, listed in order of airtime.</p>
    </section>

    <ul class="days" id="days" aria-label="Filter by day on air"></ul>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>No preachers are scheduled for this day yet.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> Spirit 88.3 FM, Kumasi</span>
    <a href="/">Back to spiritgh.com</a>
  </div>
</footer>

<audio id="stream" preload="none"></audio>
<script src="/preachers/preachers.js"></script>
<script src="/preachers/player.js"></script>
<script>
(function(){
  // Order by airtime: first "h:mm AM/PM" in the slot line; unscheduled preachers go last
  function startMins(p){
    var t = (p.time || '').toLowerCase();
    var m = /(\d{1,2}):(\d{2})\s*(am|pm|noon)?/.exec(t);
    if (!m) return 9999;
    var h = +m[1], min = +m[2], ap = m[3];
    if (!ap) { // "3:00 – 3:30 PM": take AM/PM from the end time
      var e = /[–-]\s*(\d{1,2}):\d{2}\s*(am|pm|noon)/.exec(t); ap = e ? e[2] : 'am';
      if (ap === 'pm' && e && h > +e[1] && h !== 12) ap = 'am';
    }
    if (ap === 'pm' && h !== 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    return h * 60 + min;
  }
  var list = (window.PREACHERS || []).slice().sort(function(a,b){ return startMins(a) - startMins(b) || a.name.localeCompare(b.name); });
  var grid = document.getElementById('grid'), empty = document.getElementById('empty'), daysEl = document.getElementById('days');
  var DAYS = [["all","All"],["Mon","Monday"],["Tue","Tuesday"],["Wed","Wednesday"],["Thu","Thursday"],["Fri","Friday"],["Sat","Saturday"],["Sun","Sunday"]];
  var used = {}; list.forEach(function(p){ (p.days||[]).forEach(function(d){ used[d]=1; }); });
  var esc = function(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var initials = function(n){ return n.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join(''); };

  function render(day){
    var shown = list.filter(function(p){ return day==='all' || (p.days||[]).indexOf(day) > -1; });
    grid.innerHTML = shown.map(function(p){
      var full = (p.honorific ? p.honorific + ' ' : '') + p.name;
      var ph = p.photo
        ? '<img src="/preachers/images/' + esc(p.photo) + '" alt="' + esc(full) + '" loading="lazy">'
        : '<span class="initials" aria-hidden="true">' + esc(initials(p.name)) + '</span>';
      return '<li class="card"><a href="/preachers/' + esc(p.slug) + '/">' +
        '<div class="ph">' + ph + '</div>' +
        (p.time ? '<p class="time">' + esc(p.time) + '</p>' : '') +
        (p.show ? '<h2>' + esc(p.show) + '</h2><p class="host">with ' + esc(full) + '</p>'
                : '<h2>' + esc(full) + '</h2>') +
        (p.title ? '<p class="t">' + esc(p.title) + '</p>' : '') +
        '</a></li>';
    }).join('');
    empty.hidden = shown.length > 0;
  }

  // Only show day filters once at least one preacher has a schedule
  if (Object.keys(used).length) {
    daysEl.innerHTML = DAYS.filter(function(d){ return d[0]==='all' || used[d[0]]; }).map(function(d,i){
      return '<li><button type="button" data-day="' + d[0] + '" aria-pressed="' + (i===0) + '">' + d[1] + '</button></li>';
    }).join('');
    daysEl.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      daysEl.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x===b); });
      render(b.dataset.day);
    });
  } else { daysEl.hidden = true; }

  render('all');
  document.getElementById('yr').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
